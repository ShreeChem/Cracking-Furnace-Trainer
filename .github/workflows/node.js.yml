# Build index.html from src/ and run the engine test on every push and pull request.
# The project has no npm dependencies, so this runs the README's two commands directly.

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Build index.html from src/
      run: python3 tools/build.py
    - name: Check the committed index.html is up to date
      run: git diff --exit-code -- index.html || (echo "::error::index.html is out of date. Run python3 tools/build.py and commit it." && exit 1)
    - name: Run every scenario (no action and good operator)
      run: node tests/engine-test.js
